id: ai_scalper_btc_usdt_paper_v1
controller_name: ai_scalper
controller_type: directional_trading

connector_name: binance_paper_trade
trading_pair: BTC-USDT
total_amount_quote: 100
leverage: 1
position_mode: ONEWAY
max_executors_per_side: 1
cooldown_time: 45

stop_loss: 0.004
take_profit: 0.003
time_limit: 600
take_profit_order_type: LIMIT
trailing_stop:

# Thresholds are calibrated for baseline_model.py, which is weak on purpose: 0.55 lets the paper
# bot actually trade so you can validate the whole pipeline. Raise these once a trained model is
# publishing -- a real edge should clear 0.65-0.80, and the supervisor will push them up for you.
topic: hbot/predictions
long_threshold: 0.55
short_threshold: 0.55
signal_timeout: 30
close_on_stale_signal: true

sl_multiplier: 1.5
tp_multiplier: 1.0
min_barrier: 0.0012
max_barrier: 0.02
default_target_pct: 0.004

confidence_sizing: true
min_size_scale: 0.25

entry_order_type: MARKET
activation_bounds:

manual_kill_switch: false
initial_positions: []
