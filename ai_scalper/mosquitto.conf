# Mosquitto broker for the AI scalper — loopback only.
# Copy to /etc/mosquitto/conf.d/hbot.conf, then: sudo systemctl restart mosquitto
#
# Bound to 127.0.0.1 with anonymous access because both the bot and the ML publisher run on
# this host. If the publisher ever runs elsewhere, do NOT widen this: enable auth + TLS instead
# (see the hardened block at the bottom) and keep the port closed in the firewall.

listener 1883 127.0.0.1
protocol mqtt

allow_anonymous true
persistence false
connection_messages true
log_type error
log_type warning
log_type notice
log_dest stdout

# ---- hardened variant (remote publisher) -------------------------------------------
# listener 8883
# protocol mqtt
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# cafile /etc/mosquitto/certs/ca.crt
#
# create the password file with:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd hbot
# then set MQTT_HOST / MQTT_PORT=8883 / MQTT_SSL=true / MQTT_USERNAME / MQTT_PASSWORD
# for ml_publisher.py and the matching mqtt_bridge.* keys for Hummingbot.
